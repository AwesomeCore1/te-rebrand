# Builds the web and bot images, pushes them to GitHub Container Registry and
# deploys them to the server over SSH. Runs after CI has passed on a push to
# main (never for pull requests), or by hand from the Actions tab (main only).
# Setup and the secrets it needs: docs/DEPLOY.md.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits instead of cancelling a running deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  images:
    name: Build and push images
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      prefix: ${{ steps.meta.outputs.prefix }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit CI tested, not whatever main points at now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: meta
        name: Image names
        run: |
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}/web:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.prefix }}/web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Bot image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/bot/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}/bot:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.prefix }}/bot:latest
          cache-from: type=gha,scope=bot
          cache-to: type=gha,scope=bot,mode=max

  deploy:
    name: Deploy to the server
    needs: images
    runs-on: ubuntu-latest
    # Secrets live in this environment (Settings > Environments > production),
    # where required reviewers can be added if deploys should wait for approval.
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/tacho' }}
      TAG: ${{ needs.images.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          sparse-checkout: infra
      - name: SSH key and known hosts
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host server
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
      - name: Copy the stack files
        run: >-
          scp infra/docker-compose.prod.yml infra/Caddyfile infra/.env.example
          infra/lib.sh infra/deploy.sh infra/backup.sh infra/restore.sh
          "server:$DEPLOY_PATH/"
      - name: Pull and start
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The job's token can read this repository's images for the length of
        # the job only; the server keeps no registry credentials.
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh server "docker login ghcr.io -u '${{ github.actor }}' --password-stdin >/dev/null"
          ssh server "bash '$DEPLOY_PATH/deploy.sh' '$TAG'; status=\$?; docker logout ghcr.io >/dev/null; exit \$status"
