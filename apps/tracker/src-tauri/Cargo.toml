[package]
name = "tracker"
version = "0.1.0"
description = "Tacho: logs ETS2 and ATS deliveries from the system tray"
authors = ["Tacho"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
te-telemetry = { path = "../../../crates/telemetry" }
reqwest = { version = "0.13.5", default-features = false, features = [
  "json",
  "native-tls",
  "http2",
] }
uuid = { version = "1.29.2", features = ["v4"] }
humantime = "2.4.0"
tokio = { version = "1.54.1", features = ["time", "sync"] }
thiserror.workspace = true

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

