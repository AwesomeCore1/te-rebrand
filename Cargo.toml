[workspace]
resolver = "2"
members = ["apps/tracker/src-tauri", "crates/telemetry"]

[workspace.package]
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Small, fast tracker binary (https://tauri.app/concept/size/#cargo-configuration).
# Profiles must live in the workspace root.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
